# Runs in satpost's shared network namespace and hands the proxy LNbits, and nothing else. It
# listens only on the namespace's address on the internal network, which is what the name
# lnbits resolves to there, never on the host-facing one; LNbits itself stays on 127.0.0.1.
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
  worker_connections 256;
}

stream {
  server {
    listen lnbits:5000;
    proxy_pass 127.0.0.1:5000;
    proxy_connect_timeout 5s;
  }
}
