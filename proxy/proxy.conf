# The public face of compose.proxy.yml. Answers the two Lightning-address paths, GET only (plus
# CORS preflights), and 404s everything else. It reaches LNbits through the forwarder and never
# shares a network namespace with phoenixd.
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
  worker_connections 256;
}

http {
  # Payers' addresses stay out of this container's logs.
  access_log off;
  server_tokens off;
  # nginx redirects /.well-known/lnurlp to /.well-known/lnurlp/; keep its own scheme and port
  # out of the Location header.
  absolute_redirect off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 1k;
  # Zap requests arrive as a query parameter and can be long.
  large_client_header_buffers 4 32k;

  # Docker's DNS. With the upstream in a variable, nginx looks lnbits up again every 10 seconds
  # instead of once at start, so it follows ts to a new address when ts is recreated.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # The payer's address, for LNbits' per-client rate limits: Cloudflare's header when there is
  # one, else what the proxy in front sent.
  map $http_cf_connecting_ip $payer {
    '' $http_x_forwarded_for;
    default $http_cf_connecting_ip;
  }

  server {
    listen 8080;
    set $lnbits http://lnbits:5000;

    # LNbits builds the callback URL from the host and scheme it's given.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $payer;

    location ^~ /.well-known/lnurlp/ {
      limit_except GET OPTIONS {
        deny all;
      }
      proxy_pass $lnbits;
    }

    location ^~ /lnurlp/api/v1/lnurl/cb/ {
      limit_except GET OPTIONS {
        deny all;
      }
      proxy_pass $lnbits;
    }

    location / {
      return 404;
    }
  }
}
