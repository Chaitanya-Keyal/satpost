# Lints the CLI, and checks formatting, the compose files and the nginx configs, on every push
# and pull request.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck --severity=warning bin/satpost
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: prettier
        run: npx --yes prettier@3.9.6 --check .
      - name: compose files
        run: |
          cp .env.example .env
          docker compose -f compose.yml config --quiet
          docker compose -f compose.yml -f compose.test.yml config --quiet
          SATPOST_PROXY_NETWORK=edge docker compose -f compose.yml -f compose.proxy.yml config --quiet
      - name: nginx configs
        run: |
          image=nginxinc/nginx-unprivileged:$(sed -n 's/^NGINX_VERSION=//p' .env.example)
          for conf in proxy forwarder; do
            docker run --rm --add-host lnbits:127.0.0.1 -v "$PWD/proxy:/etc/satpost:ro" \
              --entrypoint nginx "$image" -t -c "/etc/satpost/$conf.conf"
          done
