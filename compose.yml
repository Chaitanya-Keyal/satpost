# satpost: a self-hosted Lightning address.
#
# All three containers share one network namespace, owned by the Tailscale container:
#   ts        joins your tailnet as its own device and serves HTTPS (serve/)
#   phoenixd  the wallet: seed, channel and funds; its API listens on 127.0.0.1 only
#   lnbits    the Lightning address (LNURLp), comments and zap receipts, holding only
#             phoenixd's receive-only password
# Nothing is published on the host. Your settings and secrets live in .env (gitignored);
# run bin/satpost setup for the first start. See README.md.
name: satpost

# Docker keeps container logs forever unless told otherwise.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

# None of the containers needs a Linux capability, a way to gain privileges or a writable image:
# what they keep lives in the volumes. The limits keep a runaway process from taking the host down
# with it.
x-hardening: &hardening
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  pids_limit: 256

services:
  # Hands the ts and lnbits volumes to the non-root users those two run as, on every start, then
  # exits. phoenixd's image already runs as its own user.
  owners:
    <<: *hardening
    image: lnbits/lnbits:${LNBITS_VERSION:-v1.6.2}
    user: '0:0'
    cap_add: [CHOWN, DAC_READ_SEARCH]
    network_mode: none
    entrypoint:
      - sh
      - -c
      - chown -R "$$TS_UID:$$TS_UID" /ts-state && chown -R "$$LNBITS_UID:$$LNBITS_UID" /lnbits-data
    environment:
      TS_UID: ${TS_UID:-10005}
      LNBITS_UID: ${LNBITS_UID:-10004}
    volumes:
      - ts-state:/ts-state
      - lnbits-data:/lnbits-data
    mem_limit: 64m
    cpus: 0.25
    logging: *logging

  ts:
    <<: *hardening
    user: '${TS_UID:-10005}:${TS_UID:-10005}'
    # containerboot links its socket into /var/run/tailscale, where the tailscale CLI looks for it.
    # Without the mode, a restarted container gets that tmpfs back as root's 755 and the link fails.
    tmpfs: [/tmp, '/var/run/tailscale:mode=1777']
    mem_limit: 256m
    cpus: 0.25
    image: tailscale/tailscale:${TAILSCALE_VERSION:-v1.104.4}
    hostname: ${TS_HOSTNAME:-pay}
    environment:
      TS_HOSTNAME: ${TS_HOSTNAME:-pay}
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      # Log in with the key once, then reuse the saved state; a single-use key can't log in twice.
      TS_AUTH_ONCE: 'true'
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ts-state:/var/lib/tailscale
      - ./serve/${SATPOST_SERVE:-serve}.json:/config/serve.json:ro
    restart: unless-stopped
    logging: *logging
    depends_on:
      owners:
        condition: service_completed_successfully

  phoenixd:
    <<: *hardening
    mem_limit: 512m
    cpus: 0.5
    image: acinq/phoenixd:${PHOENIXD_VERSION:-0.9.3}
    network_mode: service:ts
    # The image binds the API to 0.0.0.0, which inside this namespace includes the
    # container's bridge address, reachable from every process on the host.
    entrypoint: [/phoenix/phoenixd, --agree-to-terms-of-service, --http-bind-ip, 127.0.0.1]
    command:
      [--chain, '${PHOENIXD_CHAIN:-mainnet}', --auto-liquidity, '${PHOENIXD_AUTO_LIQUIDITY:-2m}']
    volumes:
      - phoenixd-data:/phoenix/.phoenix
    restart: unless-stopped
    logging: *logging
    depends_on: [ts]

  lnbits:
    <<: *hardening
    user: '${LNBITS_UID:-10004}:${LNBITS_UID:-10004}'
    mem_limit: 1g
    cpus: 0.5
    image: lnbits/lnbits:${LNBITS_VERSION:-v1.6.2}
    network_mode: service:ts
    # The image starts LNbits through uv, which is installed in root's home where this user
    # can't reach it; the virtualenv's own entry point does the same.
    command: [/app/.venv/bin/lnbits, --port, '5000', --host, 127.0.0.1, '--forwarded-allow-ips=*']
    environment:
      LNBITS_HOST: 127.0.0.1
      LNBITS_PORT: '5000'
      LNBITS_DATA_FOLDER: /app/data
      LNBITS_ADMIN_UI: 'true'
      FIRST_INSTALL_TOKEN: ${LNBITS_FIRST_INSTALL_TOKEN:-}
      AUTH_SECRET_KEY: ${LNBITS_AUTH_SECRET_KEY:-}
      AUTH_ALLOWED_METHODS: username-password
      AUTH_HTTPS_ONLY: ${LNBITS_AUTH_HTTPS_ONLY:-true}
      LNBITS_ALLOW_NEW_ACCOUNTS: 'false'
      LNBITS_BACKEND_WALLET_CLASS: PhoenixdWallet
      LNBITS_ALLOWED_FUNDING_SOURCES: PhoenixdWallet
      PHOENIXD_API_ENDPOINT: http://127.0.0.1:9740/
      # Receive-only: phoenixd refuses every payment made with this password. Never give
      # LNbits PHOENIXD_DATA_DIR either; it would read the seed from there.
      PHOENIXD_API_PASSWORD: ${PHOENIXD_LIMITED_PASSWORD:-}
      LNBITS_EXTENSIONS_DEFAULT_INSTALL: lnurlp
      # LNbits installs extension code at runtime; the image is read-only, so into the volume.
      LNBITS_EXTENSIONS_PATH: /app/data
    volumes:
      - lnbits-data:/app/data
    restart: unless-stopped
    logging: *logging
    depends_on:
      phoenixd:
        condition: service_started
      owners:
        condition: service_completed_successfully

volumes:
  ts-state:
  phoenixd-data:
  lnbits-data:
